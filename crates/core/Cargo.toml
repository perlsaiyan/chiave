[package]
name = "chiave-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
zeroize.workspace = true
secrecy.workspace = true
keepass = { version = "0.13", features = ["save_kdbx4", "totp"] }
chrono = "0.4"
uuid = "1"
tempfile = "3"
getrandom = "0.3"

[features]
default = []
# Builders for sample vaults used by the tests of every crate in the workspace.
test-support = []

[dev-dependencies]
tempfile = "3"
chiave-core = { path = ".", features = ["test-support"] }
